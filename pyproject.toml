[project]
name = "ocean-vision"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.27.0",
    "numpy>=2.5.2",
    "opencv-python-headless>=5.0.0.93",
    "torch>=2.13.0",
    "transformers>=5.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ov1"]

# CPU-only torch wheel: this container has no GPU, and the Jetson AGX Orin
# target (spec 5.1) runs NVIDIA's own JetPack-built torch, not the desktop
# CUDA wheel PyPI serves by default. Pulling the default wheel here drags in
# ~1.5GB of x86/server nvidia-* CUDA packages that apply to neither
# environment.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# The worker loop lives in the verified-sandbox package (`uv tool install
# --editable`), not in this repo and not in its dependency graph. Only what
# genuinely differs per repo is here; see that package's README for every key.
[tool.sandbox]
# The model cache is worth persisting across workers for the same reason the uv
# cache is: without it every session re-downloads and throws the result away.
volumes = ["claude-hf-cache:/home/node/.cache/huggingface"]

[tool.sandbox.forward-env]
# A secret, so it is emitted as a bare `-e HF_TOKEN` and its value never
# reaches docker's argv, where any user on the host could read it from `ps`.
HF_TOKEN = "gated Hugging Face repos will 401 and look like a missing model"

[tool.sandbox.env]
HF_HOME = "/home/node/.cache/huggingface"
